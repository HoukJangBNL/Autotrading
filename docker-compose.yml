version: '3.8'

services:
  postgres:
    image: postgres:15-alpine
    container_name: schwab-api-postgres
    environment:
      - POSTGRES_USER=api_user
      - POSTGRES_PASSWORD=api_password
      - POSTGRES_DB=schwab_api
    volumes:
      - postgres_data:/var/lib/postgresql/data
      - ./scripts/init_db.sql:/docker-entrypoint-initdb.d/init.sql
    ports:
      - "5432:5432"
    networks:
      - api-network
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U api_user -d schwab_api"]
      interval: 10s
      timeout: 5s
      retries: 5

  pgadmin:
    image: dpage/pgadmin4:latest
    container_name: schwab-api-pgadmin
    environment:
      - PGADMIN_DEFAULT_EMAIL=admin@schwabapi.com
      - PGADMIN_DEFAULT_PASSWORD=admin123
    volumes:
      - pgadmin_data:/var/lib/pgadmin
    ports:
      - "5050:80"
    networks:
      - api-network
    depends_on:
      - postgres
    restart: unless-stopped

networks:
  api-network:
    driver: bridge

volumes:
  postgres_data:
  pgadmin_data: