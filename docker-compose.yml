version: '3.8'

services:
  # PostgreSQL with TimescaleDB
  postgres:
    image: timescale/timescaledb:latest-pg15
    container_name: autotrading-postgres
    environment:
      POSTGRES_USER: ${DB_USER:-trading}
      POSTGRES_PASSWORD: ${DB_PASSWORD:-trading123}
      POSTGRES_DB: ${DB_NAME:-trading_db}
    volumes:
      - postgres_data:/var/lib/postgresql/data
    ports:
      - "5432:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${DB_USER:-trading}"]
      interval: 5s
      timeout: 5s
      retries: 5

  # Redis
  redis:
    image: redis:7-alpine
    container_name: autotrading-redis
    ports:
      - "6379:6379"
    volumes:
      - redis_data:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 5s
      retries: 5

  # FastAPI Backend
  backend:
    build:
      context: .
      dockerfile: Dockerfile.backend
    container_name: autotrading-backend
    environment:
      DATABASE_URL: postgresql://${DB_USER:-trading}:${DB_PASSWORD:-trading123}@postgres:5432/${DB_NAME:-trading_db}
      REDIS_HOST: redis
      REDIS_PORT: 6379
      SCHWAB_API_KEY: ${SCHWAB_API_KEY}
      SCHWAB_APP_KEY: ${SCHWAB_APP_KEY}
      SCHWAB_APP_SECRET: ${SCHWAB_APP_SECRET}
      SCHWAB_CALLBACK_URL: ${SCHWAB_CALLBACK_URL:-https://127.0.0.1:8182/api/auth/callback}
    volumes:
      - ./src:/app/src
      - ./config:/app/config
      - ./cert.pem:/app/cert.pem
      - ./key.pem:/app/key.pem
    ports:
      - "8182:8182"
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
    command: uvicorn src.api.main:app --host 0.0.0.0 --port 8182 --reload --ssl-keyfile=/app/key.pem --ssl-certfile=/app/cert.pem

  # Celery Worker
  celery-worker:
    build:
      context: .
      dockerfile: Dockerfile.backend
    container_name: autotrading-celery-worker
    environment:
      DATABASE_URL: postgresql://${DB_USER:-trading}:${DB_PASSWORD:-trading123}@postgres:5432/${DB_NAME:-trading_db}
      REDIS_HOST: redis
      REDIS_PORT: 6379
      SCHWAB_API_KEY: ${SCHWAB_API_KEY}
      SCHWAB_APP_KEY: ${SCHWAB_APP_KEY}
      SCHWAB_APP_SECRET: ${SCHWAB_APP_SECRET}
    volumes:
      - ./src:/app/src
      - ./config:/app/config
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
    command: celery -A src.services.celery_app worker --loglevel=info

  # Celery Beat
  celery-beat:
    build:
      context: .
      dockerfile: Dockerfile.backend
    container_name: autotrading-celery-beat
    environment:
      DATABASE_URL: postgresql://${DB_USER:-trading}:${DB_PASSWORD:-trading123}@postgres:5432/${DB_NAME:-trading_db}
      REDIS_HOST: redis
      REDIS_PORT: 6379
      SCHWAB_API_KEY: ${SCHWAB_API_KEY}
      SCHWAB_APP_KEY: ${SCHWAB_APP_KEY}
      SCHWAB_APP_SECRET: ${SCHWAB_APP_SECRET}
    volumes:
      - ./src:/app/src
      - ./config:/app/config
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
    command: celery -A src.services.celery_app beat --loglevel=info

  # React Frontend
  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile
    container_name: autotrading-frontend
    environment:
      REACT_APP_API_URL: https://127.0.0.1:8182
      REACT_APP_WS_URL: wss://127.0.0.1:8182/ws
    volumes:
      - ./frontend/src:/app/src
      - ./frontend/public:/app/public
    ports:
      - "3000:3000"
    depends_on:
      - backend
    command: npm start

  # Nginx (Production only)
  nginx:
    image: nginx:alpine
    container_name: autotrading-nginx
    volumes:
      - ./nginx.conf:/etc/nginx/nginx.conf:ro
      - ./frontend/build:/usr/share/nginx/html:ro
    ports:
      - "80:80"
    depends_on:
      - backend
    profiles:
      - production

volumes:
  postgres_data:
  redis_data:

networks:
  default:
    name: autotrading-network